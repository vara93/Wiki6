{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <div>
    <div class="text-xs text-slate-500 uppercase tracking-wide">Поиск</div>
    <div class="text-xl font-semibold text-white">Результаты для «{{ query }}»</div>
  </div>
</div>

<div class="bg-card border border-slate-800 rounded-xl p-4 shadow-lg shadow-black/30">
  <form action="/search" method="get" class="mb-4">
    <input type="search" name="q" value="{{ query }}" placeholder="Искать по заголовкам и контенту" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50">
  </form>
  <div class="space-y-3">
    {% for item in results %}
      <a href="/view/{{ item.path }}" class="block px-3 py-2 rounded-lg bg-slate-900/60 border border-slate-800 hover:border-accent/50 transition">
        <div class="flex items-center justify-between text-sm text-slate-200">
          <span class="font-medium">{{ item.title }}</span>
          <span class="text-xs uppercase text-slate-500">{{ item.type }}</span>
        </div>
        <div class="text-xs text-slate-500 mt-1 truncate">{{ item.content[:140] }}...</div>
        <div class="text-xs text-slate-500 mt-1">{{ item.file }}</div>
      </a>
    {% else %}
      <div class="text-sm text-slate-500">Ничего не найдено.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
