<div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-30">
  <div class="bg-card border border-slate-800 rounded-xl shadow-2xl shadow-black/50 w-full max-w-lg p-5 relative">
    <button id="modal-close" class="absolute top-3 right-3 text-slate-500 hover:text-white">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    <div id="modal-create" class="space-y-4 hidden">
      <div>
        <div class="text-sm text-slate-400 uppercase tracking-wide">Создание узла</div>
        <div class="text-xl font-semibold text-white">Новый элемент</div>
      </div>
      <form id="create-form" class="space-y-3">
        <input type="hidden" name="parent" id="create-parent">
        <div>
          <label class="text-sm text-slate-400">Родительский раздел</label>
          <select id="parent-select" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label class="text-sm text-slate-400">Title</label>
          <input id="create-title" name="title" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50">
        </div>
        <div>
          <label class="text-sm text-slate-400">System Name (auto)</label>
          <div class="flex gap-2">
            <input id="create-name" name="name" readonly class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-400">
            <button id="create-generate" class="px-2 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-slate-200 hover:border-accent/50" type="button">Перегенерировать</button>
          </div>
          <p id="create-name-hint" class="text-xs text-slate-500 mt-1">Генерируется из Title, при конфликте добавляется суффикс.</p>
          <p id="create-error" class="text-xs text-rose-300 mt-1 hidden"></p>
        </div>
        <div>
          <label class="text-sm text-slate-400">Type</label>
          <select id="create-type" name="type" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm">
            <option value="company">Company</option>
            <option value="dc">DC</option>
            <option value="section">Section</option>
            <option value="document">Document</option>
            <option value="service">Service</option>
            <option value="server">Server</option>
            <option value="network">Network</option>
          </select>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-200" data-modal-close>Отмена</button>
          <button type="submit" class="px-3 py-2 rounded-lg bg-accent/20 text-accent border border-accent/40 hover:border-accent">Создать</button>
        </div>
      </form>
    </div>
    <div id="modal-upload" class="space-y-4 hidden">
      <div>
        <div class="text-sm text-slate-400 uppercase tracking-wide">Загрузка файла</div>
        <div class="text-xl font-semibold text-white">Вложения</div>
      </div>
      <form id="upload-form" class="space-y-3" enctype="multipart/form-data">
        <input type="hidden" name="parent" id="upload-parent">
        <div>
          <label class="text-sm text-slate-400">Файл</label>
          <input id="upload-file" name="file" type="file" required class="w-full text-sm text-slate-200">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-200" data-modal-close>Отмена</button>
          <button type="submit" class="px-3 py-2 rounded-lg bg-accent/20 text-accent border border-accent/40 hover:border-accent">Загрузить</button>
        </div>
      </form>
    </div>
  </div>
</div>
