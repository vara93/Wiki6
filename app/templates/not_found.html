{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-card border border-slate-800 rounded-2xl p-8 shadow-2xl shadow-black/40">
    <div class="flex items-center gap-3 mb-4">
      <div class="p-3 rounded-xl bg-rose-500/20 border border-rose-500/40">
        <i data-lucide="alert-circle" class="w-6 h-6 text-rose-300"></i>
      </div>
      <div>
        <div class="text-sm uppercase tracking-wide text-slate-400">404</div>
        <div class="text-2xl font-semibold text-white">Страница не найдена</div>
      </div>
    </div>
    <p class="text-slate-400 mb-6">Узел <span class="text-white font-semibold">/{{ missing_path }}</span> отсутствует. Вы можете создать его прямо сейчас.</p>
    <div class="flex gap-3">
      <button class="px-4 py-2 rounded-lg bg-accent/20 text-accent border border-accent/50 hover:border-accent" data-open-create="document" data-parent="{{ missing_path.rsplit('/',1)[0] if '/' in missing_path else '' }}">Создать</button>
      <a href="/" class="px-4 py-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-200 hover:border-accent/50">На главную</a>
    </div>
  </div>
</div>
{% endblock %}
