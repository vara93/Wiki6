{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <div>
    <div class="text-xs text-slate-500 mb-1">Редактирование: {{ file_name }}</div>
    <div class="text-xl font-semibold text-white">{{ meta.title if meta else path }}</div>
  </div>
  <div class="flex gap-2">
    <a href="/view/{{ path }}" class="px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-200 hover:border-accent/50">Отмена</a>
    <button form="save-form" class="px-3 py-2 rounded-lg bg-accent/20 text-accent border border-accent/40 hover:border-accent">Сохранить</button>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">
  <div class="flex flex-col">
    <form id="save-form" action="/save/{{ path }}" method="post" class="flex-1 flex flex-col space-y-2">
      <input type="hidden" name="file_name" value="{{ file_name }}">
      <label class="text-sm text-slate-400">Markdown</label>
      <textarea id="editor" name="content" class="flex-1 min-h-[70vh] w-full bg-card border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-accent/50 resize-none">{{ content }}</textarea>
    </form>
  </div>
  <div class="flex flex-col">
    <div class="text-sm text-slate-400 mb-2">Предпросмотр</div>
    <div id="preview" class="flex-1 min-h-[70vh] w-full bg-card border border-slate-800 rounded-lg p-4 overflow-y-auto prose prose-invert max-w-none"></div>
  </div>
</div>
{% endblock %}
